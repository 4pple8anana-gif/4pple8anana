<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0d1119;color:#e6e1d6;-webkit-font-smoothing:antialiased}a{color:#e7b56a;text-decoration:none}a:hover{color:#f3d3a0}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.85}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes flicker{0%,100%{opacity:1}45%{opacity:.82}50%{opacity:.95}70%{opacity:.88}}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.9}50%{transform:translateY(-50vh) translateX(14px)}90%{opacity:.6}100%{transform:translateY(-100vh) translateX(-10px);opacity:0}}
@keyframes bookBob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-22px) rotate(6deg)}}
@keyframes coinFlip{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
@keyframes driftR{from{transform:translateX(-8vw)}to{transform:translateX(108vw)}}
@keyframes driftL{from{transform:translateX(108vw)}to{transform:translateX(-8vw)}}
@keyframes potionBob{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-20px) rotate(10deg)}}
@keyframes flapL{0%,100%{transform:rotateY(8deg)}50%{transform:rotateY(62deg)}}
@keyframes flapR{0%,100%{transform:rotateY(-8deg)}50%{transform:rotateY(-62deg)}}html,body{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
</style>
</helmet>
<div style="position:relative;overflow:hidden;min-height:100vh;font-family:'Noto Sans KR',sans-serif;background:radial-gradient(90% 60% at 50% 100%, #2a2131 0%, rgba(13,17,25,0) 70%), radial-gradient(120% 70% at 50% 0%, #1b2436 0%, #0d1119 60%);display:flex;flex-direction:column;">
  <div style="position:absolute;inset:0;pointer-events:none;">{{ bg }}</div>
  <div ref="{{ trackRef }}" onPointerDown="{{ onTrackDown }}" style="position:fixed;right:10px;top:12vh;bottom:12vh;width:22px;z-index:20;cursor:pointer;touch-action:none;">
    <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,rgba(143,163,200,0),rgba(143,163,200,.35) 12%,rgba(143,163,200,.35) 88%,rgba(143,163,200,0));"></div>
    <div ref="{{ thumbRef }}" style="position:absolute;left:50%;top:0;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;will-change:transform;">
      <div style="width:100%;height:100%;transform:rotate(45deg);background:#e7b56a;box-shadow:0 0 10px 3px rgba(231,181,106,.55);" style-hover="background:#ffffff;box-shadow:0 0 14px 4px rgba(255,255,255,.6);"></div>
    </div>
  </div>
  <header style="position:relative;z-index:1;max-width:1080px;width:100%;box-sizing:border-box;margin:0 auto;padding:24px clamp(20px,5vw,48px);display:flex;justify-content:space-between;align-items:center;gap:16px;">
    <a href="김진혁 홈페이지.dc.html" style="font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:18px;letter-spacing:.08em;color:#e6e1d6;">Fantasy library</a>
  </header>
  <main style="position:relative;z-index:1;flex:1;max-width:1080px;width:100%;box-sizing:border-box;margin:0 auto;padding:calc(clamp(80px,16vh,160px) + 40px) clamp(20px,5vw,48px) max(clamp(80px,16vh,160px),180px);text-align:center;">
    <h1 style="margin:0;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(48px,10vw,104px);color:#fbf6ec;text-shadow:0 0 10px rgba(255,255,255,.45), 0 0 30px rgba(255,255,255,.22), 0 2px 16px rgba(13,17,25,.9);">판매</h1>
    <p style="margin:28px 0 0;font-size:clamp(15px,2.2vw,18px);line-height:1.7;color:#9aa4b8;">판타지 소설을 판매합니다.</p>
    <form onSubmit="{{ onSearch }}" style="margin:56px auto 0;max-width:520px;display:flex;align-items:center;gap:12px;border-bottom:1.5px dashed #5a6580;padding:6px 2px 0;">
      <input value="{{ query }}" onChange="{{ onQuery }}" placeholder="찾는 책 이름이나 작가를 입력하세요" style="flex:1;min-width:0;background:transparent;border:none;outline:none;color:#ffffff;text-shadow:{{ inputGlow }};font-family:'Noto Sans KR',sans-serif;font-size:clamp(15px,2.2vw,17px);padding:8px 0 2px;">
      <button type="submit" aria-label="검색" style="flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;padding:0;transition:filter .3s ease;" style-hover="filter:drop-shadow(0 0 4px rgba(255,255,255,.95)) drop-shadow(0 0 12px rgba(255,255,255,.6));">
        <span style="position:relative;display:block;width:22px;height:22px;">
          <span style="position:absolute;left:0;top:0;width:15px;height:15px;border:2px solid #ffffff;border-radius:50%;box-sizing:border-box;"></span>
          <span style="position:absolute;left:13px;top:15px;width:8px;height:2px;background:#ffffff;border-radius:1px;transform:rotate(45deg);transform-origin:left center;"></span>
        </span>
      </button>
    </form>
    <sc-if value="{{ searched }}" hint-placeholder-val="{{ false }}">
      <div style="margin:40px auto 0;max-width:720px;display:flex;flex-direction:column;gap:12px;text-align:left;">
        <sc-for list="{{ results }}" as="item" hint-placeholder-count="0">
          <div style="padding:20px 24px;border:1px solid #2e3850;border-radius:4px;background:rgba(22,29,43,.35);display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;">
            <div style="display:flex;flex-direction:column;gap:6px;min-width:0;">
              <div style="font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:20px;color:#f1ebdf;">{{ item.title }}</div>
              <div style="font-size:14px;color:#9aa4b8;">{{ item.author }}</div>
            </div>
            <div style="font-size:16px;color:#e7b56a;">{{ item.price }}</div>
          </div>
        </sc-for>
        <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
          <p style="margin:0;text-align:center;font-size:15px;color:#8e9ab2;">{{ emptyText }}</p>
        </sc-if>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  trackRef = React.createRef();
  thumbRef = React.createRef();
  syncThumb = () => {
    const t = this.trackRef.current, th = this.thumbRef.current;
    if (!t || !th) return;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const p = max > 0 ? window.scrollY / max : 0;
    th.style.transform = `translateY(${p * t.clientHeight}px)`;
  };
  scrollFromPointer = y => {
    const r = this.trackRef.current.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (y - r.top) / r.height));
    window.scrollTo({ top: p * (document.documentElement.scrollHeight - window.innerHeight) });
  };
  onTrackDown = e => {
    e.preventDefault();
    this.scrollFromPointer(e.clientY);
    const move = ev => this.scrollFromPointer(ev.clientY);
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  componentWillUnmount() { window.removeEventListener('scroll', this.syncThumb); window.removeEventListener('resize', this.syncThumb); }
  componentDidMount() {
    window.addEventListener('scroll', this.syncThumb, { passive: true });
    window.addEventListener('resize', this.syncThumb);
    this.syncThumb();
    document.querySelectorAll('main > *').forEach((el, i) => {
      Object.assign(el.style, { opacity: 0, transform: 'translateY(28px)', filter: 'blur(6px)' });
      el.getBoundingClientRect();
      Object.assign(el.style, {
        transition: `opacity 1.2s ease ${0.2 + i * 0.25}s, transform 1.2s cubic-bezier(.2,.7,.2,1) ${0.2 + i * 0.25}s, filter 1.2s ease ${0.2 + i * 0.25}s`,
        opacity: 1, transform: 'none', filter: 'none'
      });
    });
  }
  state = { items: [], query: '', results: [], searched: false };
  loadItems() {
    fetch('sell-items.json').then(r => r.json()).then(items => this.setState({ items: Array.isArray(items) ? items : [] })).catch(() => {});
  }
  buildBg() {
    const h = React.createElement;
    let s = 11;
    const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const pal = [
      ['#f3d3a0', '#e7b56a', '231,181,106'], ['#f4b6c2', '#d97a92', '217,122,146'], ['#a6e3dc', '#4fb3a8', '79,179,168'],
      ['#cdb8f5', '#9a7ae0', '154,122,224'], ['#b5d4f7', '#6d9fe0', '109,159,224'], ['#bde8b0', '#6fbf5f', '111,191,95']
    ];
    const pc = () => pal[Math.floor(Math.random() * pal.length)];
    const out = [];
    for (let i = 0; i < 90; i++) {
      const sz = r() < 0.8 ? 1 : 2;
      out.push(h('span', { key: 'st' + i, style: { position: 'absolute', left: r() * 100 + '%', top: r() * 70 + '%', width: sz, height: sz, borderRadius: '50%', background: '#fff', opacity: .3,
        boxShadow: sz > 1 ? '0 0 6px 2px rgba(255,255,255,.45)' : 'none', animation: `twinkle ${2.5 + r() * 4}s ${r() * 5}s ease-in-out infinite` } }));
    }
    [[7, 90, .9], [19, 150, .7], [33, 60, .8], [67, 70, .8], [81, 160, .7], [93, 100, .9]].forEach(([left, len, sc], i) => {
      const c = pc();
      out.push(h('div', { key: 'ln' + i, style: { position: 'absolute', left: left + '%', top: 0, transformOrigin: 'top center', animation: `sway ${4 + i * 0.7}s ${-i}s ease-in-out infinite`, transform: `scale(${sc})` } },
        h('div', { style: { width: 1, height: len, margin: '0 auto', background: 'rgba(200,190,170,.35)' } }),
        h('div', { style: { width: 12, height: 4, margin: '0 auto', borderRadius: '2px 2px 0 0', background: '#5a4a3a' } }),
        h('div', { style: { width: 20, height: 28, borderRadius: 8, background: `radial-gradient(circle at 50% 55%, #fffaf0 0%, ${c[0]} 35%, ${c[1]} 100%)`,
          boxShadow: `0 0 18px 6px rgba(${c[2]},.45), 0 0 60px 18px rgba(${c[2]},.18)`, animation: `flicker ${2 + r() * 2}s ease-in-out infinite` } }),
        h('div', { style: { width: 8, height: 3, margin: '0 auto', borderRadius: '0 0 2px 2px', background: '#5a4a3a' } })));
    });
    for (let i = 0; i < 16; i++) {
      const c = pc(), sz = 4 + r() * 7;
      out.push(h('span', { key: 'bb' + i, style: { position: 'absolute', left: r() * 100 + '%', bottom: -20, width: sz, height: sz, borderRadius: '50%',
        background: `radial-gradient(circle at 35% 35%, #fff, ${c[0]} 50%, ${c[1]})`, boxShadow: `0 0 10px 2px rgba(${c[2]},.6)`, opacity: 0,
        animation: `rise ${14 + r() * 12}s ${-r() * 26}s linear infinite` } }));
    }
    [[12, 38, 26, 1.5], [84, 30, 20, 1.2], [76, 58, 30, 1.8]].forEach(([left, top, w, flap], i) => {
      const c = pc();
      const page = side => h('span', { style: { position: 'absolute', top: 0, [side === 'L' ? 'right' : 'left']: '50%', width: '50%', height: '100%',
        transformOrigin: side === 'L' ? 'right center' : 'left center', background: `linear-gradient(90deg,${side === 'L' ? c[0] : c[1]},${side === 'L' ? c[1] : c[0]})`,
        borderRadius: side === 'L' ? '3px 0 0 3px' : '0 3px 3px 0', boxShadow: `0 0 14px 2px rgba(${c[2]},.45)`, animation: `flap${side} ${flap}s ease-in-out infinite` } });
      out.push(h('span', { key: 'bk' + i, style: { position: 'absolute', left: left + '%', top: top + '%', opacity: .5, animation: `bookBob ${6 + i}s ease-in-out infinite` } },
        h('span', { style: { position: 'relative', display: 'block', width: w, height: w * 0.7, perspective: 120 } }, page('L'), page('R'))));
    });
    const drifter = (key, top, dur, rev, bobDur, child, op) => h('span', { key, style: { position: 'absolute', left: 0, top: top + '%', opacity: op,
      animation: `${rev ? 'driftL' : 'driftR'} ${dur}s ${-r() * dur}s linear infinite` } },
      h('span', { style: { display: 'block', animation: `potionBob ${bobDur}s ${-r() * bobDur}s ease-in-out infinite` } }, child));
    for (let i = 0; i < 9; i++) {
      const gold = i % 3 !== 2, sz = 14 + r() * 9;
      const coin = h('span', { style: { display: 'block', perspective: 200 } },
        h('span', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', width: sz, height: sz, borderRadius: '50%',
          background: gold ? 'radial-gradient(circle at 35% 30%, #fff6d0 0%, #f2c94c 45%, #b8860b 100%)' : 'radial-gradient(circle at 35% 30%, #ffffff 0%, #d6dce6 45%, #7f8a9e 100%)',
          boxShadow: `inset 0 0 0 1.5px rgba(255,255,255,.35), inset 0 0 0 3px rgba(0,0,0,.12), 0 0 12px 3px ${gold ? 'rgba(242,201,76,.5)' : 'rgba(214,220,230,.45)'}`,
          animation: `coinFlip ${2.2 + r() * 2}s linear infinite` } },
          h('span', { style: { width: '34%', height: '34%', transform: 'rotate(45deg)', border: `1.5px solid ${gold ? 'rgba(140,95,10,.55)' : 'rgba(90,100,120,.5)'}` } })));
      out.push(drifter('cn' + i, 6 + r() * 70, 40 + r() * 30, i % 2 === 0, 4 + r() * 3, coin, .75));
    }
    for (let i = 0; i < 4; i++) {
      const w = 18 + r() * 8, mana = i % 2 === 1;
      const liq = mana ? ['#7ab8ff', '#3f7be0', '#2348a8', '80,140,240'] : ['#ff7a8a', '#e04a5f', '#b8293e', '240,80,100'];
      const potion = h('span', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center' } },
        h('span', { style: { width: w * 0.32, height: w * 0.16, borderRadius: 2, background: '#8a5a3a' } }),
        h('span', { style: { width: w * 0.36, height: w * 0.26, marginTop: -1, background: 'rgba(255,255,255,.14)', borderLeft: '1.5px solid rgba(255,255,255,.4)', borderRight: '1.5px solid rgba(255,255,255,.4)' } }),
        h('span', { style: { position: 'relative', width: w, height: w, marginTop: -2, borderRadius: '50%', border: '1.5px solid rgba(255,255,255,.45)', boxSizing: 'border-box',
          background: `linear-gradient(to bottom, rgba(255,255,255,.1) 0 38%, ${liq[0]} 38%, ${liq[1]} 70%, ${liq[2]} 100%)`,
          boxShadow: `0 0 16px 4px rgba(${liq[3]},.5), inset 0 -4px 8px rgba(0,0,0,.2)` } },
          h('span', { style: { position: 'absolute', left: '22%', top: '46%', width: '18%', height: '18%', borderRadius: '50%', background: 'rgba(255,255,255,.75)' } })));
      out.push(drifter('pt' + i, 10 + r() * 62, 55 + r() * 25, i % 2 === 1, 5 + r() * 3, potion, .8));
    }
    const spines = [];
    for (let i = 0; i < 140; i++) {
      const c = pc(), w = 10 + r() * 14, ht = 46 + r() * 50;
      const tilt = r() < 0.08 ? ' rotate(-8deg)' : '';
      const baseShadow = 'inset 0 6px 0 rgba(0,0,0,.18), inset 0 -10px 0 rgba(0,0,0,.18)';
      spines.push(h('span', { key: i,
        onMouseEnter: e => Object.assign(e.currentTarget.style, { transform: 'translateY(-18px)' + tilt, opacity: 1, boxShadow: `${baseShadow}, 0 0 14px 3px rgba(${c[2]},.75), 0 0 36px 8px rgba(${c[2]},.35)` }),
        onMouseLeave: e => Object.assign(e.currentTarget.style, { transform: 'translateY(0)' + tilt, opacity: .55, boxShadow: baseShadow }),
        style: { flex: 'none', width: w, height: ht, borderRadius: '2px 2px 0 0', background: `linear-gradient(90deg, ${c[1]}, ${c[0]} 45%, ${c[1]})`, cursor: 'pointer',
        opacity: .55, boxShadow: baseShadow, transform: 'translateY(0)' + tilt, transformOrigin: 'bottom left',
        transition: 'transform .35s cubic-bezier(.2,.7,.2,1), opacity .35s ease, box-shadow .35s ease' } }));
    }
    out.push(h('div', { key: 'shelf', style: { position: 'absolute', zIndex: 2, pointerEvents: 'auto', left: 0, right: 0, bottom: 0, height: 150, WebkitMaskImage: 'linear-gradient(to top,#000 72%,transparent)', maskImage: 'linear-gradient(to top,#000 72%,transparent)' } },
      h('div', { style: { position: 'absolute', left: 0, right: 0, bottom: 12, display: 'flex', alignItems: 'flex-end', gap: 2, overflow: 'hidden', padding: '40px 8px 0' } }, ...spines),
      h('div', { style: { position: 'absolute', left: 0, right: 0, bottom: 0, height: 12, background: 'linear-gradient(#4a3828,#2a1f17)', boxShadow: '0 -2px 10px rgba(231,181,106,.15)' } })));
    return out;
  }
  renderVals() {
    if (!this._bg) this._bg = this.buildBg();
    const { items, query, results, searched } = this.state;
    if (!this._loaded) { this._loaded = true; this.loadItems(); }
    return {
      bg: this._bg, trackRef: this.trackRef, thumbRef: this.thumbRef, onTrackDown: this.onTrackDown, query, results, searched,
      inputGlow: query ? '0 0 8px rgba(255,255,255,.7), 0 0 18px rgba(255,255,255,.35)' : 'none',
      noResults: searched && results.length === 0,
      emptyText: items.length === 0 ? '아직 등록된 물건이 없습니다.' : '검색 결과가 없습니다.',
      onQuery: e => this.setState({ query: e.target.value }),
      onSearch: e => {
        e.preventDefault();
        const q = query.trim().toLowerCase();
        const res = q ? items.filter(it => ['title', 'author', 'description'].some(k => String(it[k] || '').toLowerCase().includes(q))) : items;
        this.setState({ results: res, searched: true });
      }
    };
  }
}
</script>
</body>
</html>
