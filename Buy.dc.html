<style>body{margin:0;background:#0d1119;color:#e6e1d6;-webkit-font-smoothing:antialiased}a{color:#e7b56a;text-decoration:none}a:hover{color:#f3d3a0}
html,body{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes flame{0%,100%{transform:rotate(45deg) scale(1);opacity:1}30%{transform:rotate(41deg) scale(.9,1.08);opacity:.85}60%{transform:rotate(49deg) scale(1.05,.95);opacity:.95}}

@keyframes mote{0%{transform:translate(0,0);opacity:0}20%{opacity:.8}100%{transform:translate(60px,-120px);opacity:0}}
@keyframes sandTop{0%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes sandBot{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes sandFall{0%,100%{opacity:.9}50%{opacity:.5}}
@keyframes orbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes keySwing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes ring{0%,100%{transform:translateY(-14px) rotate(0)}20%{transform:translateY(-14px) rotate(-7deg)}40%{transform:translateY(-14px) rotate(7deg)}60%{transform:translateY(-14px) rotate(-5deg)}80%{transform:translateY(-14px) rotate(5deg)}}

<div style="position:relative;overflow:hidden;min-height:100vh;font-family:'Noto Sans KR',sans-serif;background:radial-gradient(70% 50% at 50% 35%, rgba(231,181,106,.10) 0%, rgba(231,181,106,0) 70%), repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 2px, rgba(0,0,0,0) 2px 96px), linear-gradient(180deg, #171a26 0%, #13141d 60%, #100f15 100%);display:flex;flex-direction:column;">

  </main>
</div>

      onField: e => this.setState({ form: { ...form, [e.target.name]: e.target.value }, status: '' }),

      },
