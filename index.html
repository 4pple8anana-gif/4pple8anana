<html>
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d1119;color:#e6e1d6;-webkit-font-smoothing:antialiased}
html,body{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#e7b56a;text-decoration:none}
a:hover{color:#f3d3a0}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}
@keyframes shoot{0%{transform:rotate(-28deg) translateX(0);opacity:0}2%{opacity:1}10%{transform:rotate(-28deg) translateX(-55vw);opacity:0}100%{transform:rotate(-28deg) translateX(-55vw);opacity:0}}
@keyframes broomBob{0%,100%{transform:translateY(0) rotate(-4deg)}25%{transform:translateY(-18px) rotate(2deg)}50%{transform:translateY(6px) rotate(-6deg)}75%{transform:translateY(-10px) rotate(3deg)}}
@keyframes bookDrift{from{transform:translateX(-12vw)}to{transform:translateX(112vw)}}
@keyframes bookDriftR{from{transform:translateX(112vw)}to{transform:translateX(-12vw)}}
@keyframes bookBob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-28px) rotate(6deg)}}
@keyframes flapL{0%,100%{transform:rotateY(8deg)}50%{transform:rotateY(62deg)}}
@keyframes flapR{0%,100%{transform:rotateY(-8deg)}50%{transform:rotateY(-62deg)}}
</style>
</helmet>
<div style="position:relative;min-height:100vh;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:radial-gradient(120% 70% at 50% 0%, #1b2436 0%, #0d1119 60%);">
  <sc-if value="{{ showStars }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;pointer-events:none;">{{ stars }}</div>
  </sc-if>

  <div ref="{{ trackRef }}" onPointerDown="{{ onTrackDown }}" style="position:fixed;right:10px;top:12vh;bottom:12vh;width:22px;z-index:20;cursor:pointer;touch-action:none;">
    <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,rgba(143,163,200,0),rgba(143,163,200,.35) 12%,rgba(143,163,200,.35) 88%,rgba(143,163,200,0));"></div>
    <div ref="{{ thumbRef }}" style="position:absolute;left:50%;top:0;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;will-change:transform;">
      <div style="width:100%;height:100%;transform:rotate(45deg);background:#e7b56a;box-shadow:0 0 10px 3px rgba(231,181,106,.55);" style-hover="background:#ffffff;box-shadow:0 0 14px 4px rgba(255,255,255,.6);"></div>
    </div>
  </div>
  <header style="position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:24px clamp(20px,5vw,48px);display:flex;justify-content:space-between;align-items:center;gap:16px;">
    <div style="font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:18px;letter-spacing:.08em;color:#e6e1d6;">Fantasy library</div>
    <nav style="display:flex;gap:clamp(14px,3vw,28px);font-size:14px;">
      <a href="#about" style="color:#9aa4b8;">소개</a>
      <a href="#work" style="color:#9aa4b8;">활동</a>
      <a href="#contact" style="color:#9aa4b8;">연락처</a>
    </nav>
  </header>

  <section style="position:relative;max-width:1080px;margin:0 auto;padding:clamp(80px,16vh,160px) clamp(20px,5vw,48px) clamp(80px,14vh,140px);text-align:center;">
    <div style="position:absolute;top:-160px;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 62%,transparent 96%);mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 62%,transparent 96%);">
    <div style="position:absolute;left:50%;top:calc(50% + 40px);width:min(860px,115vw);aspect-ratio:1;transform:translate(-50%,-50%);">
      <div style="position:absolute;inset:-10%;background:radial-gradient(circle at 50% 45%, rgba(243,211,160,.30) 0%, rgba(231,181,106,.14) 32%, rgba(231,181,106,0) 62%);opacity:{{ dragon.o }};transition:opacity 1.2s ease;"></div>
      <img src="assets/dragon-a.png" alt="" style="position:absolute;left:3.35%;top:4.8%;width:49.35%;opacity:{{ dragon.o }};transform:{{ dragon.a }};filter:drop-shadow(0 0 2px rgba(214,224,255,.55)) drop-shadow(0 0 16px rgba(150,172,240,.35));transition:opacity 1.2s ease, transform 1.6s cubic-bezier(.2,.7,.2,1);">
      <img src="assets/dragon-b.png" alt="" style="position:absolute;left:51.5%;top:11.1%;width:43.05%;opacity:{{ dragon.o }};transform:{{ dragon.b }};filter:drop-shadow(0 0 2px rgba(214,224,255,.55)) drop-shadow(0 0 16px rgba(150,172,240,.35));transition:opacity 1.2s ease .15s, transform 1.6s cubic-bezier(.2,.7,.2,1) .15s;">
      <img src="assets/dragon-c.png" alt="" style="position:absolute;left:34.9%;top:58.7%;width:55.55%;opacity:{{ dragon.o }};transform:{{ dragon.c }};filter:drop-shadow(0 0 2px rgba(214,224,255,.55)) drop-shadow(0 0 16px rgba(150,172,240,.35));transition:opacity 1.2s ease .3s, transform 1.6s cubic-bezier(.2,.7,.2,1) .3s;">
    </div>
    </div>
    <div onMouseEnter="{{ bulbOn }}" onMouseLeave="{{ bulbOff }}" onClick="{{ bulbToggle }}" style="position:relative;width:64px;margin:24px auto 16px;padding:8px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer;">
      <div style="position:relative;width:38px;height:38px;border-radius:50%;border:1.5px solid {{ bulb.border }};background:{{ bulb.glass }};box-shadow:{{ bulb.glow }};transition:all .45s ease;display:flex;align-items:center;justify-content:center;">
        <div style="width:10px;height:12px;border:1.5px solid {{ bulb.filament }};border-bottom:none;border-radius:5px 5px 0 0;margin-top:8px;transition:border-color .45s ease;"></div>
      </div>
      <div style="width:16px;height:7px;margin-top:-3px;background:{{ bulb.neck }};clip-path:polygon(0 0,100% 0,85% 100%,15% 100%);transition:background .45s ease;"></div>
      <div style="display:flex;flex-direction:column;gap:2px;margin-top:2px;">
        <div style="width:13px;height:3px;border-radius:1px;background:#5a6580;"></div>
        <div style="width:13px;height:3px;border-radius:1px;background:#5a6580;"></div>
        <div style="width:7px;height:3px;margin:0 auto;border-radius:0 0 3px 3px;background:#5a6580;"></div>
      </div>
    </div>
    <p style="position:relative;margin:0 0 20px;font-size:13px;letter-spacing:.32em;color:#8e9ab2;">FANTASY BOOKS</p>
    <h1 style="position:relative;margin:0;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(40px,9vw,96px);line-height:1.15;letter-spacing:-.01em;color:{{ title.color }};text-shadow:{{ title.glow }};transition:color .8s ease, text-shadow .8s ease;text-wrap:balance;">판타지를 찾으러 왔니?</h1>
  </section>

  <section id="about" style="position:relative;max-width:1080px;margin:0 auto;padding:clamp(64px,10vw,120px) clamp(20px,5vw,48px);border-top:1px solid #222b3d;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:32px 64px;align-items:start;">
    <div style="font-size:13px;letter-spacing:.32em;color:#e7b56a;">01 — 소개</div>
    <p style="margin:0;font-family:'Nanum Myeongjo',serif;font-size:clamp(24px,4vw,40px);line-height:1.5;color:#f1ebdf;text-wrap:pretty;grid-column:span 1;">전세계의 판타지 소설을 모아왔습니다.</p>
  </section>

  <section id="work" style="position:relative;max-width:1080px;margin:0 auto;padding:clamp(64px,10vw,120px) clamp(20px,5vw,48px);border-top:1px solid #222b3d;">
    <div style="font-size:13px;letter-spacing:.32em;color:#e7b56a;margin-bottom:40px;">02 — 활동</div>
    <div onClick="{{ onWorkClick }}" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;">
      <div style="padding:clamp(28px,4vw,40px);background:rgba(22,29,43,.25);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border:1px solid #2e3850;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;cursor:pointer;" style-hover="border-color:#ffffff;scale:1.05;box-shadow:0 0 28px 4px rgba(255,255,255,.28), inset 0 0 18px rgba(255,255,255,.08);">
        
        <h3 style="margin:0;font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:clamp(24px,3vw,30px);color:#f1ebdf;">판매</h3>
        <p style="margin:0;font-size:15px;line-height:1.7;color:#9aa4b8;">판타지 소설을 판매합니다.</p>
      </div>
      <div style="padding:clamp(28px,4vw,40px);background:rgba(22,29,43,.25);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border:1px solid #2e3850;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;cursor:pointer;" style-hover="border-color:#ffffff;scale:1.05;box-shadow:0 0 28px 4px rgba(255,255,255,.28), inset 0 0 18px rgba(255,255,255,.08);">
        
        <h3 style="margin:0;font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:clamp(24px,3vw,30px);color:#f1ebdf;">구입</h3>
        <p style="margin:0;font-size:15px;line-height:1.7;color:#9aa4b8;">판타지 소설을 구입합니다.</p>
      </div>
      <div style="padding:clamp(28px,4vw,40px);background:rgba(22,29,43,.25);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border:1px solid #2e3850;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;cursor:pointer;" style-hover="border-color:#ffffff;scale:1.05;box-shadow:0 0 28px 4px rgba(255,255,255,.28), inset 0 0 18px rgba(255,255,255,.08);">
        
        <h3 style="margin:0;font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:clamp(24px,3vw,30px);color:#f1ebdf;">번역</h3>
        <p style="margin:0;font-size:15px;line-height:1.7;color:#9aa4b8;">판타지 소설을 번역합니다.</p>
      </div>
    </div>
  </section>

  <section id="contact" style="position:relative;max-width:1080px;margin:0 auto;padding:clamp(64px,10vw,120px) clamp(20px,5vw,48px) clamp(80px,12vw,140px);border-top:1px solid #222b3d;text-align:center;">
    <div style="font-size:13px;letter-spacing:.32em;color:#e7b56a;margin-bottom:28px;">03 — 연락처</div>
    <a href="tel:01029824624" style="display:inline-block;font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:clamp(32px,7vw,64px);letter-spacing:.02em;color:#f1ebdf;" style-hover="color:#e7b56a;">010-2982-4624</a>
    <p style="margin:20px 0 0;font-size:14px;color:#8e9ab2;">모바일에서는 번호를 누르면 바로 전화가 연결됩니다.</p>
  </section>

  <footer style="position:relative;max-width:1080px;margin:0 auto;padding:24px clamp(20px,5vw,48px) 40px;border-top:1px solid #222b3d;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;color:#6b7690;">
    <a href="#top" style="color:#6b7690;" style-hover="color:#e7b56a;">판타지를 찾으러 왔니?</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showStars&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  constructor(p) {
    super(p);
    let s = 7;
    const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    this.starData = Array.from({ length: 220 }, () => ({
      left: r() * 100, top: r() * 100, size: r() < 0.7 ? 1 : r() < 0.8 ? 2 : 3, delay: r() * 6, dur: 2.5 + r() * 4, warm: r() < 0.25
    }));
    const pal = [
      ['#f3d3a0', '#e7b56a', '231,181,106'], ['#f4b6c2', '#d97a92', '217,122,146'], ['#a6e3dc', '#4fb3a8', '79,179,168'],
      ['#cdb8f5', '#9a7ae0', '154,122,224'], ['#b5d4f7', '#6d9fe0', '109,159,224'], ['#bde8b0', '#6fbf5f', '111,191,95']
    ];
    const pick = () => pal[Math.floor(Math.random() * pal.length)];
    this.bookCols = Array.from({ length: 5 }, pick);
    this.broomCols = Array.from({ length: 2 }, pick);
    // constellations: [x%, y%] points in a 0-100 box, placed at left/top with width
    this.constellations = [
      { left: 6, top: 8, w: 22, pts: [[0,40],[18,20],[38,28],[55,10],[72,30],[100,22]], edges: [[0,1],[1,2],[2,3],[3,4],[4,5]] },
      { left: 74, top: 18, w: 18, pts: [[10,10],[40,0],[70,15],[60,55],[30,60],[10,10]], edges: [[0,1],[1,2],[2,3],[3,4],[4,0]] },
      { left: 10, top: 46, w: 16, pts: [[0,0],[30,30],[60,20],[90,50],[70,90]], edges: [[0,1],[1,2],[2,3],[3,4]] },
      { left: 78, top: 58, w: 16, pts: [[20,0],[20,40],[0,80],[50,50],[100,80],[20,40]], edges: [[0,1],[1,2],[1,3],[3,4]] },
      { left: 40, top: 84, w: 20, pts: [[0,30],[25,0],[50,25],[75,5],[100,35]], edges: [[0,1],[1,2],[2,3],[3,4]] }
    ];
  }
  trackRef = React.createRef();
  thumbRef = React.createRef();
  syncThumb = () => {
    const t = this.trackRef.current, th = this.thumbRef.current;
    if (!t || !th) return;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const p = max > 0 ? window.scrollY / max : 0;
    th.style.transform = `translateY(${p * t.clientHeight}px)`;
  };
  scrollFromPointer = y => {
    const r = this.trackRef.current.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (y - r.top) / r.height));
    window.scrollTo({ top: p * (document.documentElement.scrollHeight - window.innerHeight) });
  };
  onTrackDown = e => {
    e.preventDefault();
    this.scrollFromPointer(e.clientY);
    const move = ev => this.scrollFromPointer(ev.clientY);
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  componentDidMount() {
    window.addEventListener('pageshow', () => { const w = document.querySelector('#work'); if (w) Object.assign(w.parentElement.style, { opacity: 1, filter: 'none' }); });
    window.addEventListener('scroll', this.syncThumb, { passive: true });
    window.addEventListener('resize', this.syncThumb);
    this.syncThumb();
    this.onAnchor = ev => {
      const a = ev.target.closest && ev.target.closest('a[href^="#"]');
      if (!a) return;
      if (a.getAttribute('href') === '#top') { ev.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      const t = document.querySelector(a.getAttribute('href'));
      if (!t) return;
      ev.preventDefault();
      window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY, behavior: 'smooth' });
    };
    document.addEventListener('click', this.onAnchor);
    const groups = ['#about > *', '#work > div:first-child, #work > div:nth-child(2) > div', '#contact > *'];
    const els = [];
    groups.forEach(sel => document.querySelectorAll(sel).forEach((el, i) => {
      Object.assign(el.style, { opacity: 0, transform: 'translateY(28px)', filter: 'blur(4px)',
        transition: `opacity 1.1s ease ${i * 0.15}s, transform 1.1s cubic-bezier(.2,.7,.2,1) ${i * 0.15}s, filter 1.1s ease ${i * 0.15}s, border-color .35s ease, scale .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s ease` });
      els.push(el);
    }));
    this.io = new IntersectionObserver(entries => entries.forEach(e => {
      if (e.isIntersecting) Object.assign(e.target.style, { opacity: 1, transform: 'none', filter: 'none' });
      else if (e.boundingClientRect.top > 0) Object.assign(e.target.style, { opacity: 0, transform: 'translateY(28px)', filter: 'blur(4px)' });
    }), { threshold: 0.2, rootMargin: '0px 0px -8% 0px' });
    els.forEach(el => this.io.observe(el));
  }
  componentWillUnmount() { window.removeEventListener('scroll', this.syncThumb); window.removeEventListener('resize', this.syncThumb); this.io && this.io.disconnect(); document.removeEventListener('click', this.onAnchor); }
  renderVals() {
    const h = React.createElement;
    const stars = this.starData.map((d, i) => h('span', { key: i, style: {
      position: 'absolute', left: d.left + '%', top: d.top + '%', width: d.size, height: d.size, borderRadius: '50%',
      background: '#ffffff', opacity: .3,
      boxShadow: d.size > 1 ? `0 0 ${d.size * 3}px ${d.size}px rgba(255,255,255,.5)` : 'none',
      animation: `twinkle ${d.dur}s ${d.delay}s ease-in-out infinite`
    }}));
    const cons = this.constellations.map((c, i) => h('svg', { key: 'c' + i, viewBox: '0 0 100 100', preserveAspectRatio: 'none',
      style: { position: 'absolute', left: c.left + '%', top: c.top + '%', width: c.w + 'vw', maxWidth: 260, aspectRatio: '1', overflow: 'visible', opacity: .55 } },
      ...c.edges.map(([a, b], j) => h('line', { key: 'l' + j, x1: c.pts[a][0], y1: c.pts[a][1], x2: c.pts[b][0], y2: c.pts[b][1], stroke: '#8fa3c8', strokeWidth: .5, strokeDasharray: '1.5 1.5', vectorEffect: 'non-scaling-stroke' })),
      ...c.pts.map((p, j) => h('circle', { key: 'p' + j, cx: p[0], cy: p[1], r: 1.6, fill: '#ffffff',
        style: { filter: 'drop-shadow(0 0 3px rgba(255,255,255,.9))', animation: `twinkle ${3 + (j % 3)}s ${j * 0.7}s ease-in-out infinite` } }))
    ));
    stars.push(...cons);
    [
      { left: 88, top: 4, dur: 9, delay: 1.5, len: 140 },
      { left: 62, top: 22, dur: 13, delay: 6, len: 100 },
      { left: 96, top: 40, dur: 11, delay: 9.5, len: 170 },
      { left: 74, top: 63, dur: 15, delay: 3.5, len: 120 },
      { left: 90, top: 80, dur: 12, delay: 11, len: 150 }
    ].forEach((s, i) => stars.push(h('span', { key: 's' + i, style: {
      position: 'absolute', left: s.left + '%', top: s.top + '%', width: s.len, height: 2, opacity: 0,
      transformOrigin: 'left center', borderRadius: 2,
      background: 'linear-gradient(90deg,#ffffff 0%,rgba(255,255,255,.6) 15%,rgba(255,255,255,0) 100%)',
      boxShadow: '0 0 8px 1px rgba(255,255,255,.6)',
      animation: `shoot ${s.dur}s ${s.delay}s ease-out infinite`
    } })));
    [
      { top: 24, w: 110, dur: 38, delay: -8, rev: true, op: .6 },
      { top: 74, w: 80, dur: 48, delay: -30, rev: false, op: .45 }
    ].forEach((b, i) => stars.push(h('span', { key: 'br' + i, style: {
      position: 'absolute', left: 0, top: b.top + '%', opacity: b.op,
      animation: `${b.rev ? 'bookDriftR' : 'bookDrift'} ${b.dur}s ${b.delay}s linear infinite`
    } }, h('span', { style: { display: 'block', animation: `broomBob ${5 + i * 2}s ease-in-out infinite` } },
      h('span', { style: { position: 'relative', display: 'block', width: b.w, height: b.w * 0.22, transform: b.rev ? 'none' : 'scaleX(-1)' } },
        h('span', { style: { position: 'absolute', left: 0, top: '50%', width: '72%', height: 2, marginTop: -1, borderRadius: 2, background: '#d9b27a', boxShadow: '0 0 6px rgba(231,181,106,.5)' } }),
        h('span', { style: { position: 'absolute', left: '66%', top: '50%', width: 4, height: '46%', transform: 'translateY(-50%)', borderRadius: 1, background: this.broomCols[i][0] } }),
        h('span', { style: { position: 'absolute', right: 0, top: 0, width: '33%', height: '100%', clipPath: 'polygon(0 36%,100% 0,92% 50%,100% 100%,0 64%)', background: `linear-gradient(90deg,${this.broomCols[i][0]},${this.broomCols[i][1]})`, filter: `drop-shadow(0 0 6px rgba(${this.broomCols[i][2]},.6))` } }))))));
    const books = [
      { top: 14, w: 26, dur: 70, delay: -10, flap: 1.6, rev: false, op: .55 },
      { top: 32, w: 18, dur: 90, delay: -55, flap: 1.2, rev: true, op: .4 },
      { top: 52, w: 32, dur: 80, delay: -30, flap: 1.9, rev: false, op: .5 },
      { top: 68, w: 16, dur: 100, delay: -75, flap: 1.1, rev: true, op: .35 },
      { top: 86, w: 22, dur: 85, delay: -5, flap: 1.4, rev: false, op: .45 }
    ];
    const page = (side, b, c) => h('span', { style: {
      position: 'absolute', top: 0, [side === 'L' ? 'right' : 'left']: '50%', width: '50%', height: '100%',
      transformOrigin: side === 'L' ? 'right center' : 'left center',
      background: side === 'L' ? `linear-gradient(90deg,${c[0]},${c[1]})` : `linear-gradient(90deg,${c[1]},${c[0]})`,
      borderRadius: side === 'L' ? '3px 0 0 3px' : '0 3px 3px 0',
      boxShadow: `0 0 14px 2px rgba(${c[2]},.45)`,
      animation: `flap${side} ${b.flap}s ease-in-out infinite`
    } });
    books.forEach((b, i) => stars.push(h('span', { key: 'b' + i, style: {
      position: 'absolute', left: 0, top: b.top + '%', opacity: b.op,
      animation: `${b.rev ? 'bookDriftR' : 'bookDrift'} ${b.dur}s ${b.delay}s linear infinite`
    } }, h('span', { style: { display: 'block', animation: `bookBob ${6 + i}s ease-in-out infinite` } },
      h('span', { style: { position: 'relative', display: 'block', width: b.w, height: b.w * 0.7, perspective: 120 } }, page('L', b, this.bookCols[i]), page('R', b, this.bookCols[i]))))));
    const on = !!(this.state && this.state.lit);
    const bulb = on
      ? { border: '#f3d3a0', glass: 'radial-gradient(circle at 50% 45%, #fffaf0 0%, #f6dcae 45%, #e7b56a 100%)', glow: '0 0 30px 10px rgba(243,211,160,.6), 0 0 90px 30px rgba(231,181,106,.28)', filament: '#ffffff', neck: '#e7b56a' }
      : { border: '#5a6580', glass: 'rgba(255,255,255,.04)', glow: 'none', filament: '#6b7690', neck: '#5a6580' };
    const dragon = on
      ? { o: .6, a: 'translate(0,0) scale(1)', b: 'translate(0,0) scale(1)', c: 'translate(0,0) scale(1)' }
      : { o: 0, a: 'translate(-10%,-6%) scale(.9)', b: 'translate(10%,-6%) scale(.9)', c: 'translate(4%,10%) scale(.9)' };
    const set = v => () => this.setState({ lit: v });
    const title = on
      ? { color: '#ffffff', glow: '0 0 12px rgba(255,255,255,.75), 0 0 36px rgba(255,255,255,.4), 0 0 80px rgba(220,230,255,.25)' }
      : { color: '#f1ebdf', glow: '0 0 0 rgba(255,255,255,0)' };
    const onWorkClick = e => {
      const h3 = e.target.closest('#work > div:nth-child(2) > div')?.querySelector('h3');
      const page = { '판매': 'Sell.dc.html', '구입': 'Buy.dc.html', '번역': 'Translate.dc.html' }[h3 && h3.textContent.trim()];
      if (!page) return;
      const root = document.querySelector('#work').parentElement;
      Object.assign(root.style, { transition: 'opacity .6s ease, filter .6s ease', opacity: 0, filter: 'blur(6px)' });
      setTimeout(() => { window.location.href = page; }, 600);
    };
    return { bulb, dragon, title, onWorkClick, trackRef: this.trackRef, thumbRef: this.thumbRef, onTrackDown: this.onTrackDown, bulbOn: set(true), bulbOff: set(false), bulbToggle: () => this.setState(s => ({ lit: !(s && s.lit) })), showStars: this.props.showStars ?? true, stars };
  }
}
